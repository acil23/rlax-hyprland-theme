# Optional Rlax Ex-Aid theme integration for Hyprland.
# Copy/include only what you want; this file deliberately avoids binds,
# monitor/input settings, autostart, and user application preferences.

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(B84A84cc) rgba(7A315Fcc) 45deg
    col.inactive_border = rgba(59595955)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(FF149355)
    }
    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.15
    }
}

animations {
    enabled = true
}