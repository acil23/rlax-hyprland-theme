# Optional lock-screen theme. Installer substitutes @RLAX_THEME_ASSETS@.
general {
    hide_cursor = true
}

background {
    monitor =
    path = @RLAX_THEME_ASSETS@/login_background.jpeg
    color = rgb(030509)
    blur_passes = 0
}

shape {
    monitor =
    size = 720, 448
    rounding = 18
    border_size = 3
    border_color = rgba(255,42,145,0.95)
    color = rgba(3,5,9,0.68)
    position = 0, -4
    halign = center
    valign = center
}

label {
    monitor =
    text = P1  //  PLAYER LOCKED
    color = rgba(255,233,74,1.0)
    font_size = 18
    font_family = Press Start 2P
    position = 0, 186
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M:%S"
    color = rgba(255,255,255,1.0)
    font_size = 56
    font_family = Press Start 2P
    position = 0, 112
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A  //  %d %B %Y"
    color = rgba(24,243,236,1.0)
    font_size = 14
    font_family = Press Start 2P
    position = 0, 56
    halign = center
    valign = center
}
label {
    monitor =
    text = INSERT GASHAT  //  ENTER PASSCODE
    color = rgba(255,233,74,1.0)
    font_size = 13
    font_family = Press Start 2P
    position = 0, -20
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 520, 64
    outline_thickness = 3
    font_family = Press Start 2P
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(24,243,236,1.0)
    inner_color = rgba(3,5,9,0.92)
    font_color = rgba(255,255,255,1.0)
    check_color = rgba(89,255,131,1.0)
    fail_color = rgba(255,42,145,1.0)
    fade_on_empty = false
    rounding = 8
    placeholder_text = <i>TYPE PASSWORD TO CONTINUE...</i>
    fail_text = <i>ACCESS DENIED  //  TRY AGAIN</i>
    hide_input = false
    position = 0, -104
    halign = center
    valign = center
}