[workspace]
members = [
    "apps/rlax-launcher",
    "apps/rlax-power-menu",
    "crates/rlax-ui",
    "crates/rlax-hypr",
    "crates/rlax-security",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rlax <rlax@arch>"]
license = "MIT"
repository = "https://github.com/acil23/customApp"
rust-version = "1.75"

[workspace.dependencies]
gtk4 = { version = "0.11", package = "gtk4" }
gtk4-layer-shell = "0.8"
glib = "0.22"
gio = "0.22"
gdk4 = "0.11"
pango = "0.22"
